x-django: &django
  image: ghcr.io/flare-foundation/data-availability:latest
  env_file:
    - .env
  restart: unless-stopped

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  django:
    <<: *django
    ports:
      - "127.0.0.1:${SERVER_PROXY_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  process-ftso-data:
    <<: *django
    command: python manage.py process_ftso_data
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy

  process-fdc-data:
    <<: *django
    command: python manage.py process_fdc_data
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy

  delete-history:
    <<: *django
    command: python manage.py delete_history
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy

  # The DAL. Both services are optional: without CCHAIN_DB_HOST there is no
  # indexer to read triggers from, and this service collects nothing.
  collect-dal:
    <<: *django
    command: python manage.py collect_dal --contract ${DAL_INSTRUCTIONS_CONTRACT} --from-block ${DAL_FROM_BLOCK:-0}
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy

  # Separate from delete-history on purpose: that prunes FTSO and FDC rounds by
  # voting round, this prunes artifacts by their own lifecycle, and the two must
  # not share a schedule.
  dal-delete-history:
    <<: *django
    command: python manage.py dal_delete_history
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy

volumes:
  pg_data:
